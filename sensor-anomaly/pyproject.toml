[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sensor-anomaly"
version = "0.1.0"
description = "Spot abnormal behaviour across many industrial sensor channels at once, including faults only visible between channels"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "anomaly-detection",
  "sensors",
  "time-series",
  "industrial",
  "iot",
  "predictive-maintenance",
  "multivariate",
  "pandas",
  "machine-learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "scikit-learn>=1.1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
dev = ["pytest>=7", "pyarrow>=12"]

[project.scripts]
sensor-anomaly = "sensor_anomaly.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/sensor-anomaly/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/sensor_anomaly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
