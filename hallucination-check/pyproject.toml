[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hallucination-check"
version = "0.1.0"
description = "Check an answer against the sources it claims to use and flag every unsupported sentence"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "hallucination",
  "grounding",
  "rag",
  "citation",
  "fact-checking",
  "llm-evaluation",
  "attribution",
  "faithfulness",
  "nlp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hallucination-check = "hallucination_check.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/hallucination-check/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/hallucination_check"]
