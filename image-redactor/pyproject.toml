[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "image-redactor"
version = "0.1.0"
description = "Blur or mask faces, plates and regions you mark, with a detector you supply or a simple built-in one"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "redaction",
  "privacy",
  "anonymize",
  "blur",
  "pixelate",
  "faces",
  "license-plates",
  "image-processing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Security",
]
dependencies = [
  "numpy>=1.23",
  "Pillow>=9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
image-redactor = "image_redactor.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/image-redactor/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/image_redactor"]
