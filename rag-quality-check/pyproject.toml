[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rag-quality-check"
version = "0.1.0"
description = "Measure whether a retrieval system is actually retrieving the right things"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "rag",
  "retrieval",
  "evaluation",
  "ndcg",
  "mrr",
  "groundedness",
  "information-retrieval",
  "llm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
frame = ["pandas>=1.3"]
dev = ["pytest>=7", "pandas>=1.3"]

[project.scripts]
rag-quality-check = "rag_quality_check.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/rag-quality-check/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_quality_check"]
