[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-router-lite"
version = "0.1.0"
description = "Send each prompt to the cheapest model that can handle it, and fall back when one fails"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "llm",
  "router",
  "routing",
  "fallback",
  "cost",
  "complexity",
  "openai",
  "offline",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
llm-router-lite = "llm_router_lite.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/llm-router-lite/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_router_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
