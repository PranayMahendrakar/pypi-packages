[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "near-dupes"
version = "0.1.0"
description = "Find near-duplicate text, records and images with one call, then dedupe keeping the best copy"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "deduplication",
  "near-duplicate",
  "duplicate-detection",
  "minhash",
  "lsh",
  "jaccard",
  "dhash",
  "fuzzy-matching",
  "pandas",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
]

[project.optional-dependencies]
images = ["Pillow>=9"]
parquet = ["pyarrow>=12"]
dev = ["pytest>=7", "Pillow>=9", "pyarrow>=12"]

[project.scripts]
near-dupes = "near_dupes.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/near-dupes/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/near_dupes"]
