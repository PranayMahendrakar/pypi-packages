[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "video-event-detector"
version = "0.1.0"
description = "Detect falls, crowding, abandoned objects and sudden movement from a sequence of frames"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "video-analytics",
  "event-detection",
  "motion-detection",
  "background-subtraction",
  "fall-detection",
  "abandoned-object",
  "crowd-detection",
  "cctv",
  "surveillance",
  "computer-vision",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "numpy>=1.23",
  "Pillow>=9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
video-event-detector = "video_event_detector.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/video-event-detector/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/video_event_detector"]
