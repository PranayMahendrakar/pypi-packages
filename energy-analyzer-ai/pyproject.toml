[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "energy-analyzer-ai"
version = "0.1.0"
description = "Find unusual energy consumption, explain what changed, and estimate what it is costing"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "energy",
  "electricity",
  "smart-meter",
  "consumption",
  "anomaly-detection",
  "kwh",
  "tariff",
  "submetering",
  "pandas",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
]

[project.optional-dependencies]
# heavy or niche deps go here, never in `dependencies`
parquet = ["pyarrow>=12"]
dev = ["pytest>=7", "pyarrow>=12"]

[project.scripts]
energy-analyzer-ai = "energy_analyzer_ai.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/energy-analyzer-ai/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_analyzer_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
