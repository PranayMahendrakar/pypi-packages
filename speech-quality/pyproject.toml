[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "speech-quality"
version = "0.1.0"
description = "Measure whether a voice recording is clean enough to transcribe or publish"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "speech-quality",
  "audio-quality",
  "voice",
  "recording",
  "transcription",
  "clipping",
  "signal-to-noise",
  "noise-floor",
  "wav",
  "audio-analysis",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
speech-quality = "speech_quality.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/speech-quality/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/speech_quality"]
