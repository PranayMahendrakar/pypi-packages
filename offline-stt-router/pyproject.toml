[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "offline-stt-router"
version = "0.1.0"
description = "Find which speech-to-text engines are installed locally and pick the right one for this machine and language"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "speech-to-text",
  "stt",
  "asr",
  "whisper",
  "faster-whisper",
  "whisper.cpp",
  "vosk",
  "offline",
  "transcription",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
offline-stt-router = "offline_stt_router.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/offline-stt-router/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/offline_stt_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]

