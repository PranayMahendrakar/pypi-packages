[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-inference-profiler"
version = "0.1.0"
description = "Find the slow step in an ML inference pipeline, from preprocessing to postprocessing"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "profiling",
  "performance",
  "latency",
  "benchmark",
  "inference",
  "pipeline",
  "machine-learning",
  "bottleneck",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0", "twine>=5.0"]

[project.scripts]
ml-inference-profiler = "ml_inference_profiler.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/ml-inference-profiler/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_inference_profiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
