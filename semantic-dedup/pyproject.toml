[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "semantic-dedup"
version = "0.1.0"
description = "Remove passages that repeat the same meaning, not just the same words"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "deduplication",
  "semantic-similarity",
  "paraphrase",
  "tfidf",
  "minhash",
  "embeddings",
  "text-cleaning",
  "nlp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
semantic-dedup = "semantic_dedup.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/semantic-dedup/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_dedup"]
