[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "call-ai-metrics"
version = "0.1.0"
description = "Measure talk time, interruptions, silence and pace in a two-party call"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "call-analytics",
  "conversation-analysis",
  "talk-time",
  "talk-ratio",
  "interruptions",
  "silence",
  "response-latency",
  "diarization",
  "speech-analytics",
  "call-center",
  "stereo-recording",
  "wav",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Communications :: Telephony",
]
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
# only CallReport.to_frame() needs pandas; everything else runs on numpy alone
pandas = ["pandas>=1.5"]
dev = ["pytest>=7", "pandas>=1.5"]

[project.scripts]
call-ai-metrics = "call_ai_metrics.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/call-ai-metrics/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/call_ai_metrics"]
