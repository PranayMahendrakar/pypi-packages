[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "model-benchmark"
version = "0.1.0"
description = "Benchmark several models on the same task and compare latency, memory and accuracy side by side"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "benchmark",
  "latency",
  "throughput",
  "profiling",
  "model-comparison",
  "inference",
  "machine-learning",
  "pandas",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
]

[project.optional-dependencies]
# heavy or niche deps go here, never in `dependencies`
parquet = ["pyarrow>=12"]
dev = ["pytest>=7", "pyarrow>=12"]

[project.scripts]
model-benchmark = "model_benchmark.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/model-benchmark/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/model_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
