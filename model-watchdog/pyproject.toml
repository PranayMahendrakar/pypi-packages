[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "model-watchdog"
version = "0.1.0"
description = "Lightweight production monitoring for any ML model: log predictions, catch drift and silent failure"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "model monitoring",
  "ml monitoring",
  "drift detection",
  "population stability index",
  "psi",
  "silent failure",
  "observability",
  "mlops",
  "pandas",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
dev = ["pytest>=7"]

[project.scripts]
model-watchdog = "model_watchdog.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/model-watchdog/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/model_watchdog"]
