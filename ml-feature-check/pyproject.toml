[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-feature-check"
version = "0.1.0"
description = "Catch useless, redundant, leaking and suspicious features before you train on them"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "machine-learning",
  "feature-selection",
  "data-leakage",
  "data-quality",
  "pandas",
  "preprocessing",
  "tabular",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "scikit-learn>=1.1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
dev = ["pytest>=7"]

[project.scripts]
ml-feature-check = "ml_feature_check.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/ml-feature-check/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_feature_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error::RuntimeWarning",
  "error::FutureWarning",
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  "error::UserWarning",
]
