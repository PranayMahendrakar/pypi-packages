[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "text-quality-ai"
version = "0.1.0"
description = "Score text for readability, repetition, structure and clarity, and say what to fix"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "readability",
  "text-quality",
  "flesch",
  "flesch-kincaid",
  "smog",
  "writing",
  "editing",
  "passive-voice",
  "repetition",
  "nlp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
text-quality-ai = "text_quality_ai.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/text-quality-ai/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/text_quality_ai"]
