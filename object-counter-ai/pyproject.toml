[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "object-counter-ai"
version = "0.1.0"
description = "Count objects in images or across video frames, with a detector you supply or a simple built-in one"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "object-counting",
  "counting",
  "blob-counting",
  "connected-components",
  "line-crossing",
  "tracking",
  "video",
  "detector",
  "image-processing",
  "pillow",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "numpy>=1.23",
  "Pillow>=9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
object-counter-ai = "object_counter_ai.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/object-counter-ai/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/object_counter_ai"]
