[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "production-anomaly"
version = "0.1.0"
description = "Catch abnormal production rates, downtime and process drift on a manufacturing line"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "manufacturing",
  "production",
  "oee",
  "downtime",
  "availability",
  "micro-stops",
  "anomaly-detection",
  "process-drift",
  "shop-floor",
  "pandas",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
dev = ["pytest>=7"]

[project.scripts]
production-anomaly = "production_anomaly.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/production-anomaly/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/production_anomaly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
