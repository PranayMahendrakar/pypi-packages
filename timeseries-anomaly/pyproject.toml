[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "timeseries-anomaly"
version = "0.1.0"
description = "Find anomalies in any time series or IoT signal with one call, no model training required"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "anomaly-detection",
  "time-series",
  "outlier-detection",
  "iot",
  "sensor",
  "monitoring",
  "seasonality",
  "pandas",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
]

[project.optional-dependencies]
# heavy or niche deps go here, never in `dependencies`
parquet = ["pyarrow>=12"]
dev = ["pytest>=7", "pyarrow>=12"]

[project.scripts]
timeseries-anomaly = "timeseries_anomaly.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/timeseries-anomaly/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/timeseries_anomaly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
