[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "voice-activity-ai"
version = "0.1.0"
description = "Find where someone is actually speaking in a recording, and where it is just noise"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "voice-activity-detection",
  "vad",
  "speech-detection",
  "silence-removal",
  "audio-segmentation",
  "trim-silence",
  "speech-ratio",
  "audio",
  "wav",
  "signal-processing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
voice-activity-ai = "voice_activity_ai.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/voice-activity-ai/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_activity_ai"]
