[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "Estimate how close equipment is to failure from sensor history, and train a failure model when you have labels"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Mahendrakar" }]
keywords = [
  "predictive maintenance",
  "remaining useful life",
  "rul",
  "condition monitoring",
  "equipment health",
  "anomaly detection",
  "sensor data",
  "time series",
  "pandas",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "scikit-learn>=1.1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
dev = ["pytest>=7"]

[project.scripts]
predictive-maintenance = "predictive_maintenance.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/predictive-maintenance/"
Author = "https://pypi.org/user/pranaymahendrakar/"

[tool.hatch.build.targets.wheel]
packages = ["src/predictive_maintenance"]
