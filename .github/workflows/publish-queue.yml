name: Publish the next few from the queue

# Runs daily and publishes up to MAX_PER_RUN packages that are approved but not yet
# on PyPI. Nothing here depends on a developer machine being switched on.
#
# Why four: measured, not guessed. On two consecutive days this account published
# exactly four new projects and then received HTTP 429 on every further upload until
# roughly the next day. PyPI throttles how fast one account may CREATE projects
# (updating an existing one is unaffected), so four per run is the real ceiling and
# asking for more just burns the run.

on:
  schedule:
    # Every four hours rather than once a day, because we do not actually know how long
    # PyPI's new-project window is. Measured so far: four published on 21 Sep, four on
    # 22 Sep, and a run 21 hours after the last of those still got 429. A daily attempt
    # tells us almost nothing; six attempts a day finds the edge and publishes the
    # moment the window opens.
    #
    # Retrying is cheap and safe: each run skips anything already on PyPI, so the worst
    # case is a build that uploads nothing. Minutes past the hour are staggered off the
    # hour because scheduled jobs cluster there and GitHub delays them under load.
    - cron: "20 2,6,10,14,18,22 * * *"
  workflow_dispatch:
    inputs:
      max_packages:
        description: "How many to attempt this run"
        required: false
        default: "4"
        type: string
      dry_run:
        description: "Work out the queue and build, but upload nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  MAX_PER_RUN: ${{ inputs.max_packages || '4' }}

jobs:
  pick:
    name: Work out what to publish
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.queue.outputs.packages }}
      count: ${{ steps.queue.outputs.count }}
      remaining: ${{ steps.queue.outputs.remaining }}
    steps:
      - uses: actions/checkout@v4

      - id: queue
        name: Approved, minus whatever is already live
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > queue.json
          import json, urllib.request, urllib.error, os

          approved = json.load(open("approved.json"))

          def on_pypi(name: str) -> bool:
              """Already published? A 404 means no; anything else we treat as yes,
              because wrongly believing a package is missing would double-publish it,
              while wrongly skipping one only delays it to tomorrow."""
              try:
                  urllib.request.urlopen(
                      f"https://pypi.org/pypi/{name}/json", timeout=20
                  ).read(1)
                  return True
              except urllib.error.HTTPError as exc:
                  return exc.code != 404
              except Exception:
                  return True

          pending = [name for name in approved if not on_pypi(name)]
          limit = int(os.environ.get("MAX_PER_RUN", "4") or "4")
          print(json.dumps({"batch": pending[:limit], "remaining": len(pending)}))
          PY
          BATCH=$(python -c "import json;print(json.dumps(json.load(open('queue.json'))['batch']))")
          REMAIN=$(python -c "import json;print(json.load(open('queue.json'))['remaining'])")
          COUNT=$(python -c "import json;print(len(json.load(open('queue.json'))['batch']))")
          echo "packages=$BATCH"   >> "$GITHUB_OUTPUT"
          echo "count=$COUNT"      >> "$GITHUB_OUTPUT"
          echo "remaining=$REMAIN" >> "$GITHUB_OUTPUT"
          echo "### Queue" >> "$GITHUB_STEP_SUMMARY"
          echo "$REMAIN package(s) still unpublished; attempting $COUNT this run:" >> "$GITHUB_STEP_SUMMARY"
          python -c "import json;[print('- ' + n) for n in json.load(open('queue.json'))['batch']]" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: ${{ matrix.package }}
    needs: pick
    if: ${{ needs.pick.outputs.count != '0' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Each matrix job exchanges its own OIDC identity for upload rights to its own
      # project, so one package's failure cannot publish another's.
      id-token: write
    env:
      # `secrets` cannot be read inside an `if:` expression, so the presence of a
      # token becomes a plain string flag here and the steps below branch on that.
      HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    strategy:
      # Sequential on purpose. Parallel uploads are exactly the burst that trips the
      # rate limit, and fail-fast off means one bad package does not cancel the rest.
      max-parallel: 1
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.pick.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Test the installed package, not the source beside it
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install ".[dev]" || python -m pip install . pytest
          mkdir -p /tmp/run
          cp -r tests /tmp/run/
          for extra in README.md pyproject.toml; do
            [ -f "$extra" ] && cp "$extra" /tmp/run/
          done
          cd /tmp/run && python -m pytest -q tests

      - name: Build
        working-directory: ${{ matrix.package }}
        run: |
          rm -rf dist
          python -m build
          python -m twine check dist/*

      # Two ways to authenticate, and the workflow takes whichever is set up.
      #
      # Trusted publishing is the better one: nothing is stored anywhere and the
      # credential lives for minutes. It needs a publisher registered on PyPI for
      # EACH package name, because a publisher authorises one project, not an account.
      #
      # An API token is one setup step instead of one per package. It is encrypted at
      # rest and never exposed to pull requests from forks, but it is a long-lived
      # account-wide credential, so prefer trusted publishing once the names exist.
      - name: Publish with trusted publishing
        id: publish_oidc
        continue-on-error: true
        if: ${{ !inputs.dry_run && env.HAS_TOKEN != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.package }}/dist/
          print-hash: true

      - name: Publish with an API token
        id: publish_token
        continue-on-error: true
        if: ${{ !inputs.dry_run && env.HAS_TOKEN == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.package }}/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true

      - name: Did it actually land?
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          # Ask PyPI rather than trusting the step's exit code. A 429 means "not yet",
          # which is an ordinary outcome while the window is closed, and failing the run
          # for it would cry wolf six times a day. Anything else is a real problem.
          sleep 15
          code=$(curl -s -o /dev/null -w '%{http_code}'                  "https://pypi.org/pypi/${{ matrix.package }}/json")
          if [ "$code" = "200" ]; then
            echo "- ${{ matrix.package }}: PUBLISHED" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          outcome="${{ steps.publish_token.outcome }}${{ steps.publish_oidc.outcome }}"
          echo "- ${{ matrix.package }}: not published this run (upload step: $outcome)" >> "$GITHUB_STEP_SUMMARY"
          echo "  Usually PyPI's new-project rate limit. The next run in four hours retries." >> "$GITHUB_STEP_SUMMARY"
          echo "  If it never lands, read the upload log: a name rejected as 'too similar to an" >> "$GITHUB_STEP_SUMMARY"
          echo "  existing project' needs renaming and will never succeed on retry." >> "$GITHUB_STEP_SUMMARY"

  report:
    name: What actually published
    needs: [pick, publish]
    if: ${{ always() && needs.pick.outputs.count != '0' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count what landed
        shell: bash
        run: |
          # The publish jobs go green even when PyPI refuses, because a closed window is
          # an ordinary condition rather than a broken build. That made every run read as
          # "success" while nothing shipped, which is worse than a red X: it answers the
          # question you were actually asking with the wrong word. So the real count gets
          # its own job, and the job fails when a whole batch was refused - not because
          # anything is broken, but because "nothing published" should not look identical
          # to "everything published".
          published=0
          refused=0
          for name in $(python -c "import json;print(' '.join(json.load(open('approved.json'))))"); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/json")
            if [ "$code" = "200" ]; then published=$((published+1)); else refused=$((refused+1)); fi
          done
          echo "## Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**$published** of the queue are now on PyPI; **$refused** still waiting." >> "$GITHUB_STEP_SUMMARY"
          if [ "$published" = "0" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing published this run. PyPI answers *429 Too many new projects created*" >> "$GITHUB_STEP_SUMMARY"
            echo "while its window is shut; it does not say for how long. The next run tries again" >> "$GITHUB_STEP_SUMMARY"
            echo "in four hours. Nothing here needs fixing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
